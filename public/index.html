<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <title>FriendsChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="conn-banner" class="hidden">connecting…</div>

  <div id="screen-auth" class="screen">
    <div class="auth-wrap">
      <div class="auth-logo">💬</div>
      <h1>FriendsChat</h1>
      <p class="auth-tag">Private chats, just for your friends.</p>
      <form id="auth-form" class="card">
        <input id="auth-username" placeholder="username" autocomplete="username" maxlength="20" required>
        <input id="auth-password" type="password" placeholder="password (8+ characters)" autocomplete="current-password" required>
        <p id="auth-error" class="error"></p>
        <button type="submit">Log in</button>
        <button type="button" id="btn-signup" class="secondary">Create an account</button>
      </form>
    </div>
  </div>

  <div id="screen-home" class="screen hidden">
    <header class="app-bar">
      <h1>FriendsChat</h1>
      <button id="btn-account" class="avatar-btn" title="Account"></button>
    </header>
    <div class="search-wrap">
      <input id="search-chats" type="search" placeholder="🔍  Search chats" autocomplete="off">
    </div>
    <p id="home-error" class="error"></p>
    <div id="requests-banner" class="hidden"></div>
    <ul id="chat-list" class="conv-list"></ul>
    <p id="empty-state" class="empty hidden">
      No chats yet.<br><span class="muted">Tap <b>+</b> to add a friend or start a group.</span>
    </p>
    <button id="fab" title="New chat">+</button>
  </div>

  <div id="screen-chat" class="screen hidden">
    <header class="app-bar chat-bar">
      <button id="btn-back" class="icon-btn">‹</button>
      <div id="chat-avatar" class="avatar"></div>
      <div class="chat-heading">
        <h2 id="chat-title"></h2>
        <span id="chat-sub" class="chat-sub"></span>
      </div>
    </header>
    <div id="messages"></div>
    <div id="emoji-picker" class="hidden"></div>
    <form id="form-send" class="composer">
      <button type="button" id="btn-emoji" class="icon-btn">😊</button>
      <label id="btn-image" class="icon-btn">📎<input type="file" id="image-input" accept="image/*,video/*" hidden></label>
      <input id="message-input" placeholder="Message" autocomplete="off" maxlength="2000">
      <button type="submit" id="btn-send" class="send-btn">➤</button>
    </form>
  </div>

  <div id="sheet-backdrop" class="hidden"></div>
  <div id="sheet" class="hidden">
    <div class="sheet-grip"></div>
    <div id="sheet-menu">
      <button class="sheet-item" data-action="friend"><span class="sheet-ico">👤</span><span><b>Add a friend</b><small>By their exact username</small></span></button>
      <button class="sheet-item" data-action="group"><span class="sheet-ico">👥</span><span><b>Create a group</b><small>Get a code to share</small></span></button>
      <button class="sheet-item" data-action="join"><span class="sheet-ico">🔗</span><span><b>Join with a code</b><small>Someone sent you 6 letters</small></span></button>
      <div class="sheet-you">Your username: <b id="sheet-me"></b> <button type="button" id="btn-copy-me" class="copy-btn">copy</button></div>
    </div>
    <div id="sheet-form" class="hidden">
      <button type="button" id="sheet-back" class="icon-btn">‹</button>
      <h3 id="sheet-title"></h3>
      <form id="sheet-action">
        <input id="sheet-input" autocomplete="off">
        <p id="sheet-error" class="error"></p>
        <button type="submit" id="sheet-submit"></button>
      </form>
      <ul id="sheet-friends" class="conv-list"></ul>
    </div>
  </div>

  <div id="media-viewer" class="hidden">
    <div id="viewer-top">
      <span id="viewer-sender"></span>
      <svg id="ring" viewBox="0 0 36 36" width="44" height="44" aria-hidden="true">
        <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
        <circle id="ring-fg" cx="18" cy="18" r="16" fill="none" stroke="#fff" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="0"
                transform="rotate(-90 18 18)"/>
      </svg>
      <span id="ring-secs">30</span>
      <button id="viewer-close" class="icon-btn">✕</button>
    </div>
    <div id="viewer-content"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
